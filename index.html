    <script>
      // Critical fix for "Cannot set property fetch of #<Window> which has only a getter"
      // This environment sometimes has window.fetch as a read-only getter.
      // We force it to be writable or provide a setter so polyfills can wrap it.
      (function() {
        try {
          const win = window;
          if (win.fetch) {
            const descriptor = Object.getOwnPropertyDescriptor(win, 'fetch') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(win), 'fetch');
            if (descriptor && (!descriptor.writable || !descriptor.set) && descriptor.configurable) {
              let currentFetch = win.fetch;
              Object.defineProperty(win, 'fetch', {
                get: function() { return currentFetch; },
                set: function(v) { 
                  currentFetch = v; 
                },
                configurable: true,
                enumerable: true
              });
            }
          }
          // Polyfill global if missing
          if (typeof win.global === 'undefined') {
            win.global = win;
          }
        } catch (e) {
          // Silent catch
        }
      })();
